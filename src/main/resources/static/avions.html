<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avions</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <h2>SkyReserve</h2>
      <p>Administration des billets</p>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html" class="">Dashboard</a>
<a href="admins.html" class="">Admins</a>
<a href="users.html" class="">Utilisateurs</a>
<a href="compagnies.html" class="">Compagnies</a>
<a href="avions.html" class="active">Avions</a>
<a href="aeroports.html" class="">Aéroports</a>
<a href="vols.html" class="">Vols</a>
<a href="reservations.html" class="">Réservations</a>
<a href="billets.html" class="">Billets</a>
<a href="paiements.html" class="">Paiements</a>
<a href="#" onclick="logout()">Déconnexion</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div>
        <h1>Avions</h1>
        <p>Créer et gérer les avions.</p>
      </div>
      <button class="btn btn-secondary" onclick="logout()">Se déconnecter</button>
    </div>

    
<section class="panel">
  <div class="panel-header"><h2>Formulaire</h2></div>
  <input type="hidden" id="avionId">
  <div class="form-grid">
    <div class="form-group"><label>Modèle</label><input id="modele"></div>
    <div class="form-group"><label>Capacité</label><input id="capacite" type="number"></div>
    <div class="form-group"><label>Immatriculation</label><input id="immatriculation"></div>
    <div class="form-group"><label>ID Compagnie</label><input id="compagnieId" type="number"></div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="saveAvion()">Enregistrer</button>
    <button class="btn btn-secondary" onclick="resetAvionForm()">Réinitialiser</button>
  </div>
  <p id="avionMessage" class="message"></p>
</section>
<section class="panel">
  <div class="panel-header"><h2>Liste des avions</h2><button class="btn btn-secondary" onclick="loadAvions()">Actualiser</button></div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>ID</th><th>Modèle</th><th>Capacité</th><th>Immatriculation</th><th>Compagnie</th><th>Actions</th></tr></thead>
      <tbody id="avionsTableBody"></tbody>
    </table>
  </div>
</section>

  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/avions.js"></script>
</body>
</html>
