<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Connexion Admin</h1>
    <p>Accède à la plateforme complète de gestion des administrateurs, utilisateurs, compagnies, avions, aéroports, vols, réservations, billets et paiements.</p>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@email.com">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary full" onclick="loginAdmin()">Se connecter</button>
    <p id="loginMessage" class="message"></p>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
