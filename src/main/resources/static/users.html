<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <h2>SkyReserve</h2>
      <p>Administration des billets</p>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html" class="">Dashboard</a>
<a href="admins.html" class="">Admins</a>
<a href="users.html" class="active">Utilisateurs</a>
<a href="compagnies.html" class="">Compagnies</a>
<a href="avions.html" class="">Avions</a>
<a href="aeroports.html" class="">Aéroports</a>
<a href="vols.html" class="">Vols</a>
<a href="reservations.html" class="">Réservations</a>
<a href="billets.html" class="">Billets</a>
<a href="paiements.html" class="">Paiements</a>
<a href="#" onclick="logout()">Déconnexion</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div>
        <h1>Utilisateurs</h1>
        <p>Ajouter, modifier, supprimer et consulter les utilisateurs.</p>
      </div>
      <button class="btn btn-secondary" onclick="logout()">Se déconnecter</button>
    </div>

    
<section class="panel">
  <div class="panel-header"><h2>Formulaire</h2></div>
  <input type="hidden" id="userId">
  <div class="form-grid">
    <div class="form-group"><label>Nom</label><input id="nom" placeholder="Nom"></div>
    <div class="form-group"><label>Prénom</label><input id="prenom" placeholder="Prénom"></div>
    <div class="form-group"><label>Email</label><input id="email" placeholder="Email"></div>
    <div class="form-group"><label>Mot de passe</label><input id="motDePasse" placeholder="Mot de passe"></div>
    <div class="form-group"><label>Téléphone</label><input id="telephone" placeholder="Téléphone"></div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="saveUser()">Enregistrer</button>
    <button class="btn btn-secondary" onclick="resetUserForm()">Réinitialiser</button>
  </div>
  <p id="userMessage" class="message"></p>
</section>
<section class="panel">
  <div class="panel-header"><h2>Liste des utilisateurs</h2><button class="btn btn-secondary" onclick="loadUsers()">Actualiser</button></div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>ID</th><th>Nom complet</th><th>Email</th><th>Téléphone</th><th>Actions</th></tr></thead>
      <tbody id="usersTableBody"></tbody>
    </table>
  </div>
</section>

  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/users.js"></script>
</body>
</html>
